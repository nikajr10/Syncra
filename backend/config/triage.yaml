# Triage training data (Task 2.1): which items are worth learning from.
#
# The two top-level keys are the labels; `make train-triage` trains the SetFit classifier on them
# (Task 2.2). Each example is the text triage reads for one item: the title (when the text doesn't
# already contain it), a blank line, then the text, exactly as the connectors store them (already
# scrubbed, so secrets show up as <AWS_ACCESS_KEY> etc.). Slack threads are "slack:<id>: text"
# lines. Keep both labels about the same size, and retrain after editing.
#
#   useful  knowledge: what was built, decided, owned, broken or fixed, and why. Reviews that
#           approve or request changes count however short: they record who reviewed what.
#   noise   thanks / +1 / emoji-only replies, CI and bot chatter, trivial commits, pings,
#           social chat.

useful:
  # --- GitHub pull requests and issues ---
  - |-
    Add queue between checkout and payments

    The payment provider times out under load (p99 above 8 s), which fails checkout. This puts a RabbitMQ queue in front of payment-service so checkout returns right away and a worker processes the payments.

    Closes PAY-1234.
  - |-
    Move billing from REST to gRPC

    JSON payloads between billing and ledger are about 4x larger than the proto equivalents and parsing shows up in every flame graph. This switches the billing to ledger calls to gRPC. The REST endpoints stay for one release for old clients.
  - |-
    Cap payment retries at 3

    We retried failed charges up to 10 times, which hammered the provider during Tuesday's outage. Three retries with exponential backoff cover every transient error we saw in the last 90 days.
  - |-
    Add idempotency keys to charge requests

    A retry after a timeout could double-charge a customer because the provider saw two separate requests. Every charge now sends an Idempotency-Key derived from the order id.
  - |-
    Fix flaky checkout integration test

    The test raced the payment worker. It now waits for the order to reach PAID instead of sleeping for 2 seconds.
  - |-
    Switch auth from JWT to server-side sessions

    We couldn't revoke JWTs when an account was locked. Sessions now live in Redis with a 12 h TTL; logout and lockout delete them.
  - |-
    Remove the legacy v1 payments API

    No traffic on /v1/charges for 60 days (checked the access logs). Deleting the handlers and the old serializers.
  - |-
    Rate limit the login endpoint

    5 attempts per minute per IP and per account, using the Redis we already run. The brute-force attempts from last week's incident would have been stopped after the fifth try.
  - |-
    Upgrade Postgres from 14 to 16

    Needed for the logical replication fixes. Ran the upgrade on a copy of prod: 6 minutes of downtime and all queries pass.
  - |-
    Split notification-service out of the monolith

    Email and SMS sending have their own release cadence and kept blocking monolith deploys. The new service consumes the existing events topic, so no API changes.
  - |-
    Add circuit breaker around the fraud check

    When the fraud API is down we now fail open for orders under $50 and fail closed above that, as agreed with the risk team.
  - |-
    Cache exchange rates for 5 minutes

    Every checkout called the FX provider and we paid for about 2M calls a day. Rates are now cached in Redis for 5 minutes, which finance confirmed is fine.
  - |-
    Add Grafana dashboard for the payment queue

    Shows queue depth, consumer lag and failed messages. Linked from the payments runbook.
  - |-
    Document the refund flow

    Adds docs/refunds.md: how partial refunds work, which service owns which step, and how to replay a failed refund.
  - |-
    Use the shared HTTP client in fraud-service

    It had its own client without timeouts, which is how the fraud outage took checkout down with it.
  - |-
    Add CODEOWNERS for payments

    Changes under services/payments now need a review from the payments team.
  - Add partial refund endpoint
  - |-
    Checkout fails with 504 when the payment provider is slow

    Since Monday about 2% of checkouts fail with a gateway timeout. Logs show the provider call taking 30 s or more. We need a timeout and a retry policy.
  - |-
    Webhook signatures fail after secret rotation

    After rotating the webhook secret, merchants on SDK versions below 3.1 get signature errors because the SDK caches the old secret for 24 hours.
  - |-
    Memory leak in notification-service

    RSS grows about 200 MB a day until the pod is OOM-killed. The heap dump points at the template cache, which never evicts anything.
  - |-
    Support partial refunds

    Finance needs partial refunds for damaged-item claims. Today support issues a full refund and charges again, which confuses customers.
  - |-
    Add audit log for admin actions

    Compliance needs a record of who changed refund limits and when. Store it in Postgres and keep it for 7 years.
  - |-
    Document how to rotate the webhook secret

    Nobody remembered the steps last time and the rotation took 2 hours. We need a runbook.
  - |-
    Move secrets from env files to the secrets manager

    All services read credentials from Vault now. The .env files only hold non-secret config.
  - |-
    Search returns deleted products

    The search index isn't updated on delete; the nightly reindex is the only thing that removes them.
  - |-
    Add dead-letter queue for failed payments

    Messages that fail 3 times go to payments.dlq instead of being dropped. On-call gets an alert when it's not empty.
  - |-
    Settlement report misses refunds

    Refunds created on the last day of the month are counted in the next month's report.

  # --- commits ---
  - |-
    Use exponential backoff for webhook delivery

    Fixed 1 s retries overloaded merchant endpoints while they were down.
  - |-
    Fix race in order status update

    Two workers could mark the same order PAID and SHIPPED out of order. The update now checks the current status in the WHERE clause.
  - |-
    Raise ledger client timeout from 2s to 5s

    Ledger p99 is 3.1 s since the October migration, so the 2 s timeout was failing 4% of writes.
  - |-
    Drop the unused coupons table

    Coupons moved to the promotions service in March and nothing reads this table anymore (checked pg_stat_user_tables).
  - |-
    Log the provider request id on every charge

    Support needs it to trace disputes with the provider.
  - |-
    Encrypt card fingerprints at rest

    PCI audit finding #7. Uses the existing KMS key for the payments schema.
  - |-
    Revert "Enable HTTP/2 for the API gateway"

    This reverts commit 3f2a1c9. HTTP/2 broke uploads from the Android app (stream reset after 1 MB), so we turn it off until the client is fixed.
  - |-
    Add NOT NULL constraint to orders.currency

    Every row has a currency since the backfill in #350.
  - |-
    Remove feature flag new_checkout

    Rolled out to 100% three weeks ago with no issues.
  - |-
    Handle provider 429 with retry-after

    The provider started sending 429s during peak hours; we now wait as long as its retry-after header says instead of failing the charge.
  - |-
    Fix timezone bug in settlement report

    Settlements after 23:00 UTC were counted on the next day for US merchants.
  - |-
    Add retry_limit setting to the webhook sender

    Defaults to 5. Merchants on slow hosts asked for more attempts.
  - |-
    Switch email provider from SendGrid to SES

    SES is 70% cheaper at our volume and we already run everything else on AWS.
  - |-
    Validate currency against the cart before charging

    Fixes the CAD/USD mix-up for saved cards (PAY-1302).
  - Disable retries on 409 from the payment provider
  - Add index on orders.customer_id
  - Pin grpcio to 1.66 because 1.67 has no wheel for ARM Linux
  - |-
    Downgrade boto3 to 1.34

    1.35 changed the default S3 checksum and broke uploads to MinIO.
  - |-
    Upgrade Django to 5.1.2

    Fixes CVE-2024-45230 in the admin panel.
  - Pin numpy below 2.0 until pandas is upgraded, pandas 1.5 crashes on import with numpy 2
  - Pin redis-py to 5.0 because 5.1 drops support for our Redis 6 cluster
  - Hold back webpack at 5.93, 5.94 breaks the source maps we upload to Sentry
  - Lock node to 20.x in .nvmrc, the build fails on 22 because of the old node-sass
  - |-
    Replace moment.js with date-fns

    moment is unmaintained and adds 70 KB to the checkout bundle.

