# Every model Syncra uses, by role (see description.md §8).
#
#   runtime: ollama      -> name is the Ollama tag ("qwen3:8b"); pulled by scripts/pull_ollama_models.py
#   runtime: huggingface -> name is the Hugging Face repo id; revision pins the exact commit (supply chain:
#                           a pushed change to the repo can't silently swap the weights);
#                           downloaded by scripts/download_hf_models.py
#   runtime: spacy       -> spaCy pipeline used by Presidio (installed with pip)
#
# Change a model here, not in code. Everything runs locally.

models:
  # --- Learning pipeline ---
  entity_finder: # GLiNER: people, services, tools, projects
    runtime: huggingface
    name: urchade/gliner_small-v2.1
    revision: 4e091416cf7c3481db542c2a3d26156916f3a47f  # pinned commit; bump deliberately
    labels: [person, service, tool, project]  # entity types to look for (stored as entities.type)
    threshold: 0.5  # hits scoring lower are dropped
  entity_finder_encoder: # the encoder GLiNER is built on: only its tokenizer + config are used
    runtime: huggingface
    name: microsoft/deberta-v3-small
    revision: a36c739020e01763fe789b4b85e2df55d6180012  # pinned commit; bump deliberately
    files: [config.json, spm.model, tokenizer_config.json]  # not the 850 MB of weights
  decision_reader: # Qwen3: thread/PR -> {decision, reason, people}
    runtime: ollama
    name: qwen3:8b
  embedder: # Qwen3-Embedding: chunk -> 1024-dim vector (embedding_dim in settings must match)
    runtime: huggingface
    name: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3  # pinned commit; bump deliberately
  entity_linker: # SBERT: merge same entity under different names
    runtime: huggingface
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41  # pinned commit; bump deliberately
  triage_base: # SetFit body for useful-vs-noise (trained head saved locally by Task 2.2)
    runtime: huggingface
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41  # pinned commit; bump deliberately
  presidio_nlp: # spaCy pipeline Presidio runs on
    runtime: spacy
    name: en_core_web_sm

  # --- Chatbot pipeline ---
  question_rewriter: # Qwen3 4B: follow-up -> standalone question
    runtime: ollama
    name: qwen3:4b
  prompt_guard: # Meta Prompt Guard 2 (gated: needs HF_TOKEN + accepted licence)
    runtime: huggingface
    name: meta-llama/Llama-Prompt-Guard-2-86M
    gated: true
  intent_router_base: # SetFit body for small_talk / question / action (trained head saved by Task 5.5)
    runtime: huggingface
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41  # pinned commit; bump deliberately
  reranker: # cross-encoder: scores evidence, keeps best 8
    runtime: huggingface
    name: cross-encoder/ms-marco-MiniLM-L-6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a  # pinned commit; bump deliberately
  answer_writer: # Qwen3 8B: evidence + history -> cited answer
    runtime: ollama
    name: qwen3:8b
  claim_checker: # DeBERTa NLI: checks each claim against its evidence
    runtime: huggingface
    name: cross-encoder/nli-deberta-v3-base
    revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7  # pinned commit; bump deliberately
