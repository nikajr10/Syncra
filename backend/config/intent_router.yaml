# Intent router training data (Task 5.5): what a chat message wants.
#
# The three top-level keys are the labels; `make train-intent-router` trains the SetFit classifier
# on them (stratified 80/20 split, prints held-out accuracy):
#   small_talk  greetings, thanks, goodbyes, acknowledgements, questions about Syncra itself:
#               answered at once with a canned reply, no search and no LLM
#   question    anything to look up in the team's GitHub, Jira and Slack, including short
#               follow-ups ("and billing?") and requests to show, list, explain or summarise
#   action      asks Syncra to change something (create / close / assign a ticket, post a
#               message, merge a PR, ...): becomes an approval card, never runs on its own
#
# Look-alikes are deliberate: "how do I create a jira ticket?" and "did anyone open a ticket for
# it?" are questions; "thanks, now open a ticket for it" is an action; "hi, who built X?" is a
# question. Every example is quoted, so YAML never reads ": " as a key or " #" as a comment.

