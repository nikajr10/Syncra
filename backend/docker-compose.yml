# Production deployment (Linux host): Postgres + pgvector, Ollama, API, worker.
# Not used for local development (local dev runs against your own Postgres and native Ollama).
#
#   cp .env.example .env            # set POSTGRES_PASSWORD at least
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3:4b && docker compose exec ollama ollama pull qwen3:8b
#   docker compose run --rm api python scripts/download_hf_models.py
#
name: syncra

x-backend: &backend
  build: .
  image: syncra-backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syncra}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-syncra}
    OLLAMA_BASE_URL: http://ollama:11434
    DEVICE: ${DEVICE:-cpu}  # cuda only with an NVIDIA image + the GPU reservation below
    API_DOCS: "false"  # no public Swagger / OpenAPI in production
  volumes:
    - hf_models:/models
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-syncra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # admin access from the host only (DBeaver via SSH tunnel)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncra} -d ${POSTGRES_DB:-syncra}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:0.35.0 # keep in step with the version tested locally
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU: install the NVIDIA Container Toolkit and uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --no-server-header"
    ports:
      # Host-local only: the API has no login yet. Publish it through a TLS reverse proxy
      # (Caddy / nginx) on the same host, never directly on a public port.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    <<: *backend
    command: python -m app.jobs.scheduler
    depends_on:
      api:
        condition: service_healthy # api ran the migrations

volumes:
  postgres_data:
  ollama_data:
  hf_models:
