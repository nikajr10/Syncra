# ---------------------------------------------------------------- answerable: why / meaning
- question: Why do orders go through a queue before payments?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|#42", "C0ENGPAY|1772450000.000100", "PAY|PAY-118"]
  answer: Because the payment provider PayGate timed out under load (8% of charges at 400 rps) and took checkout down, so checkout now hands orders to a RabbitMQ queue.

- question: Why did we pick RabbitMQ instead of Kafka?
  user: bob
  answerable: true
  sources: ["acme-pay/payments|#42", "C0ENGPAY|1772450000.000100", "PAY|comment:1181"]
  answer: Platform already runs RabbitMQ and peak volume is only about 50 charges per second, so Kafka would be overkill.

- question: Why are refund retries capped at 3?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|#57", "acme-pay/payments|review:5701", "PAY|PAY-131", "C0ENGPAY|1774861500.000200"]
  answer: Northwind Bank flags more than 3 refund attempts on the same transaction within 24 hours as fraud and freezes the merchant account.

- question: Why did we add idempotency keys to card charges?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|#63", "PAY|PAY-140"]
  answer: Customers were double-charged when RabbitMQ redelivered messages after a payments-worker restart; idempotency keys stop a repeated charge.

- question: Why did we move billing calls from REST to gRPC?
  user: bob
  answerable: true
  sources: ["acme-pay/payments|#71", "PAY|PAY-152", "PAY|comment:1521"]
  answer: REST calls to billing-service had a p99 of 420ms while gRPC measured about 95ms, and billing will later stream invoice events.

- question: Why is the refund worker backoff test flaky?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|#78"]
  answer: It uses real time.sleep and asserts on wall-clock time, so it fails about 1 in 15 runs on slow CI runners.

- question: Why are we upgrading the payments database to Postgres 16?
  user: bob
  answerable: true
  sources: ["acme-pay/payments|#84", "PAY|PAY-160"]
  answer: The analytics team needs logical replication from the standby, and the cloud provider is ending support for Postgres 15.

- question: Why did we add rate limiting to the public API?
  user: bob
  answerable: true
  sources: ["acme-pay/payments|#92", "PAY|PAY-178", "C0ENGPAY|1788444900.001000"]
  answer: On Sept 3 a merchant integration looped at about 9,000 requests per second and degraded the API for every merchant.

- question: Why did we move the docs site from Jekyll to MkDocs?
  user: dave
  answerable: true
  sources: ["acme-pay/docs|#12", "C0GENERAL|1770886800.000100"]
  answer: Jekyll builds took about 6 minutes and needed an unmaintained Ruby toolchain; MkDocs Material builds in 40 seconds with only Python and has search built in.

- question: Why did we choose Keycloak over Auth0 for customer SSO?
  user: dave
  answerable: true
  sources: ["acme-pay/auth|#17", "AUTH|AUTH-21", "AUTH|comment:211", "C0ENGAUTH|1778776800.000100"]
  answer: Cost (Auth0 quoted about $38k per year versus about $6k of infrastructure for Keycloak), EU data residency, and Keycloak's SAML brokering worked for all 4 pilot merchants.

# ---------------------------------------------------------------- answerable: exact ids / keywords
- question: What does PAY-131 say?
  user: alice
  answerable: true
  sources: ["PAY|PAY-131"]
  answer: Northwind Bank froze the merchant account for 6 hours after a 4th refund retry; the bank flags more than 3 refund attempts in 24 hours as fraud, so retries are capped at 3.

- question: What does charge_card() do with idempotency keys?
  user: bob
  answerable: true
  sources: ["acme-pay/payments|#63"]
  answer: It requires an idempotency_key (a UUIDv4 per order attempt), stores it with a unique index, and returns the original charge on a repeated call instead of charging again.

- question: What is error E4012?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|comment:6303", "PAY|PAY-185", "C0ENGPAY|1781777400.000500"]
  answer: E4012 is IdempotencyKeyMismatch, an idempotency key reused with a different amount or currency, so the charge is refused.

- question: What is the billing_grpc feature flag for?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|#71", "C0ENGPAY|1782307800.000600"]
  answer: It gates the switch of billing calls from REST to gRPC, starting at 10% of traffic.

- question: What is the name of the dead-letter queue for charges?
  user: frank
  answerable: true
  sources: ["acme-pay/payments|review:4204", "acme-pay/payments|7c3e9a1f5b2d48e6a0c4f8b19d2e7a3c5f1b6d90", "acme-pay/docs|#15"]
  answer: payments.charge.dlq.

- question: What does AUTH-40 say?
  user: dave
  answerable: true
  sources: ["AUTH|AUTH-40"]
  answer: All admin dashboard users must use TOTP-based MFA by November 1, enforced with a Keycloak required action.

- question: What does make replay-dlq do?
  user: dave
  answerable: true
  sources: ["acme-pay/docs|#15"]
  answer: It replays failed charge messages from the payments.charge.dlq dead-letter queue.

- question: Which Keycloak version is running in production?
  user: dave
  answerable: true
  sources: ["C0ENGAUTH|1789984800.000300"]
  answer: Keycloak 25.0.6.

