# ---------------------------------------------------------------- answerable: details / follow-up style
- question: What did Carol ask to change in the RabbitMQ queue PR?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|review:4202", "acme-pay/payments|review_comment:4203", "acme-pay/payments|review:4204"]
  answer: Add a dead-letter queue and ack messages only after the charge row is committed.

- question: What happens to a refund after the third failed retry?
  user: frank
  answerable: true
  sources: ["acme-pay/payments|#57", "PAY|comment:1311", "C0ENGPAY|1774861500.000200"]
  answer: It moves to the manual review queue and on-call is paged.

- question: Are partial refunds also capped at 3 retries?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|comment:5703"]
  answer: Yes, partial refunds go through the same refund worker.

- question: How many customers were double-charged in April?
  user: frank
  answerable: true
  sources: ["PAY|PAY-140"]
  answer: 14 customers, on April 22; all were refunded the same day.

- question: How long are idempotency keys kept?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|#63", "acme-pay/payments|review:6301"]
  answer: 24 hours.

- question: What was the p99 latency for billing calls with the gRPC flag at 10%?
  user: frank
  answerable: true
  sources: ["C0ENGPAY|1782307800.000600"]
  answer: 98ms, down from 420ms.

- question: When does the gRPC billing rollout go to 100%?
  user: bob
  answerable: true
  sources: ["C0ENGPAY|1782307800.000600"]
  answer: On the Monday after the 10% stage, if the error rate stays under 0.1%.

- question: How was the flaky refund backoff test fixed?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|comment:7801", "acme-pay/payments|#78"]
  answer: By freezing time with freezegun; 200 CI reruns in a row were green.

- question: How long was the downtime for the Postgres 16 upgrade?
  user: alice
  answerable: true
  sources: ["C0ENGPAY|1787215500.000800", "acme-pay/payments|#84"]
  answer: About 11 minutes were planned from the staging test; the actual downtime was 9 minutes.

- question: When was the maintenance window for the payments database upgrade?
  user: frank
  answerable: true
  sources: ["acme-pay/payments|#84", "C0ENGPAY|1787215500.000800"]
  answer: Saturday Aug 22, 02:00 to 03:00 UTC.

- question: What is our webhook retry policy?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|#88", "PAY|PAY-171"]
  answer: 5 retries at 1 minute, 5 minutes, 30 minutes, 2 hours and 12 hours, then the event is marked failed and can be resent by hand.

- question: How long does a merchant endpoint have to answer a webhook?
  user: carol
  answerable: true
  sources: ["acme-pay/payments|#88"]
  answer: It must return a 2xx response within 10 seconds.

- question: What is the rate limit on the public API?
  user: frank
  answerable: true
  sources: ["acme-pay/payments|#92", "PAY|comment:1781", "C0ENGPAY|1788444900.001000"]
  answer: 100 requests per second per API key, with bursts up to 200.

- question: What did Carol ask to change in the rate limiting PR?
  user: alice
  answerable: true
  sources: ["acme-pay/payments|review:9201", "acme-pay/payments|review:9202"]
  answer: Add a TTL to the Redis bucket keys; a 1 hour TTL was added.

- question: What should on-call do if the payments queue backs up?
  user: bob
  answerable: true
  sources: ["acme-pay/docs|#15"]
  answer: If payments.charge is deeper than 5,000 messages, scale payments-worker to 12 replicas.

- question: When is the payments on-call handover?
  user: erin
  answerable: true
  sources: ["acme-pay/docs|#15", "C0GENERAL|1774252800.000200"]
  answer: Every Monday at 10:00 UTC.

- question: How often are JWT signing keys rotated?
  user: erin
  answerable: true
  sources: ["acme-pay/auth|#23", "C0ENGAUTH|1783681200.000200"]
  answer: Every 90 days; the next key is published in the JWKS 7 days early and the old one is kept for 24 hours.

- question: How do we rotate the signing key by hand in an emergency?
  user: dave
  answerable: true
  sources: ["acme-pay/auth|comment:2303"]
  answer: Run make rotate-now, which runs the rotation job immediately and skips the 7-day pre-publish.

- question: When is the first automatic signing key rotation?
  user: erin
  answerable: true
  sources: ["C0ENGAUTH|1783681200.000200"]
  answer: October 6.

