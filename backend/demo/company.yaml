  alice:
    name: Alice Chen
    accounts: {github: alice-chen, slack: U01ALICE, jira: acc-alice}
  bob:
    name: Bob Martinez
    accounts: {github: bobm, slack: U02BOB, jira: acc-bob}
  carol:
    name: Carol Okafor
    accounts: {github: carol-ok, slack: U03CAROL, jira: acc-carol}
  dave:
    name: Dave Kim
    accounts: {github: dave-kim, slack: U04DAVE, jira: acc-dave}
  erin:
    name: Erin Walsh
    accounts: {github: erin-w, slack: U05ERIN}
