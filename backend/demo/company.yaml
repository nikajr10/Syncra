        title: "Customer SSO provider: Keycloak or Auth0"
        text: |
          Type: Spike · Status: Done · Assignee: Dave Kim

          Merchants want SSO (SAML and OIDC) into the dashboard. Compare Auth0 (hosted) with self-hosted Keycloak
          on cost, EU data residency and SAML support, and test both with the 4 pilot merchants.
        author: jira:acc-dave
        created_at: 2026-05-04T09:00:00Z
        link: https://acme-pay.atlassian.example/browse/AUTH-21
      - external_id: comment:211
        type: comment
        text: Signed off on Keycloak. Cost decided it, about $38k per year for Auth0 enterprise versus roughly $6k per year of infrastructure for Keycloak, and Keycloak keeps EU merchant data in our own region.
        author: jira:acc-frank
        created_at: 2026-05-15T10:00:00Z
        parent_external_id: AUTH-21
        link: https://acme-pay.atlassian.example/browse/AUTH-21?focusedCommentId=211
      - external_id: AUTH-34
        type: issue
        title: Rotate JWT signing keys every 90 days
        text: |
          Type: Task · Status: Done · Assignee: Erin Walsh

          The June security audit found our JWT signing key had not been rotated since 2024. Rotate automatically every
          90 days, pre-publish the next key in the JWKS, and keep a manual emergency rotation.
        author: jira:acc-dave
        created_at: 2026-06-25T10:00:00Z
        link: https://acme-pay.atlassian.example/browse/AUTH-34
      - external_id: AUTH-40
        type: issue
        title: Require MFA for admin dashboard users
        text: |
          Type: Task · Status: To Do · Assignee: Dave Kim

          All admin dashboard users must use TOTP-based MFA by November 1. Enforce it with a Keycloak required action
          on the admin realm.
        author: jira:acc-dave
        created_at: 2026-10-05T10:00:00Z
